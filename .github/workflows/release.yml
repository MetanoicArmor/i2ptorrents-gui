name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.8.3"

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2022_64
            artifact: windows-x64
          - os: windows-11-arm
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            artifact: windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Build package
        shell: pwsh
        run: |
          . .\scripts\qt-env.ps1
          Initialize-QtCargoEnvironment | Out-Null
          .\build-windows.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            I2PTorrents-windows-*.zip
          if-no-files-found: error

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools qt6-tools-dev \
            cmake g++ pkg-config zip \
            libgl-dev libegl1 libglib2.0-0 \
            libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            dpkg-dev fakeroot rpm

      - name: Build package
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x ./build-linux.sh ./scripts/*.sh
          ./build-linux.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            I2PTorrents-linux-*.zip
            I2PTorrents-linux-*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            macos_archs: arm64
            artifact: macos-arm64
          - os: macos-13
            macos_archs: x64
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        run: brew install qt@6 cmake

      - name: Build package
        env:
          MACOS_ARCHS: ${{ matrix.macos_archs }}
        run: |
          chmod +x ./build-macos.sh ./scripts/*.sh
          ./build-macos.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            I2PTorrents-macOS-*.zip
            dist/*.app
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p upload
          find release-assets -type f \( \
            -name '*.zip' -o -name '*.tar.gz' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp -f {} upload/ \;
          ls -lah upload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
