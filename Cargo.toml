[package]
name = "i2ptorrents-gui"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Cross-platform desktop GUI for i2pd torrents"
authors = ["Vade"]
default-run = "i2ptorrents-gui"
readme = "README.md"

[features]
default = ["gui"]
gui = ["dep:qtrs"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2.12", default-features = false }
url = "2"
qtrs = { version = "0.5.7", optional = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "i2ptorrents-gui"
path = "src/main.rs"
required-features = ["gui"]
